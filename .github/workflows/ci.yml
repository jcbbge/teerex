name: Build and regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux API13 and Apple-silicon cross-build
            runner: ubuntu-24.04
            target: x86_64-linux-musl
            zig-platform: x86_64-linux
            zig-sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
            rex-api: 13
            rex-commit: aa2db1b21261b479a550559fb70e2c3a66c07ba2
            rex-archive: rex-linux-amd64.tar.gz
            rex-sha256: 90b2429036d26f317aaac2490d014e07c9351b0b994b1329afce94b8ad4d333c
          - name: Mac API10 (Rex preview.13)
            runner: macos-26
            target: aarch64-macos
            zig-platform: aarch64-macos
            zig-sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
            rex-api: 10
            rex-commit: 1b6654811346488b696ded8f3c7e6701c57242f1
            rex-archive: rex-darwin-arm64.zip
            rex-sha256: dfc3c5d57c9637ac21f41a7fa425a453fed64d68152b90772afb2d815b028977
          - name: Mac API12 (Rex preview.14)
            runner: macos-26
            target: aarch64-macos
            zig-platform: aarch64-macos
            zig-sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
            rex-api: 12
            rex-commit: 7e460d02f51573990bfcdc6c44a5606d11c7d47a
            rex-archive: rex-darwin-arm64.zip
            rex-sha256: 728df49b2cefcd62b7dde14cfcbd238cac69ec1524d71c19e6a389728ebe5374
          - name: Mac API13 (Rex preview.16)
            runner: macos-26
            target: aarch64-macos
            zig-platform: aarch64-macos
            zig-sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
            rex-api: 13
            rex-commit: aa2db1b21261b479a550559fb70e2c3a66c07ba2
            rex-archive: rex-darwin-arm64.zip
            rex-sha256: 3055299e4fe881d97e8ca452e33906b8a9c7aedf36b836845ebb587829b29a29
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Isolate invocation history for every regression suite
        run: echo "TEEREX_CALL_LOG_DIR=$RUNNER_TEMP/teerex-call-history" >> "$GITHUB_ENV"

      - name: Select Xcode 26.1.1 for Zig 0.15.2
        if: runner.os == 'macOS'
        run: |
          developer=/Applications/Xcode_26.1.1.app/Contents/Developer
          test -d "$developer"
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer" xcodebuild -version
          DEVELOPER_DIR="$developer" xcrun --sdk macosx --show-sdk-path

      - name: Install checksum-pinned Zig 0.15.2
        env:
          ZIG_PLATFORM: ${{ matrix.zig-platform }}
          ZIG_SHA256: ${{ matrix.zig-sha256 }}
        run: |
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://ziglang.org/download/0.15.2/zig-${ZIG_PLATFORM}-0.15.2.tar.xz" -o "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-${ZIG_PLATFORM}-0.15.2" >> "$GITHUB_PATH"

      - name: Record toolchain and runner
        run: |
          test "$(zig version)" = 0.15.2
          zig version
          python3 --version
          uname -srm
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"

      - name: Check Zig formatting
        run: zig fmt --check build.zig src items tools/cartridges

      - name: Build target CLI
        run: zig build -Doptimize=ReleaseSmall -Dtarget=${{ matrix.target }}

      - name: Run native child supervisor regressions
        run: zig test src/child_test.zig

      - name: Verify static Linux executable
        if: runner.os == 'Linux'
        run: |
          file zig-out/bin/teerex
          readelf -lW zig-out/bin/teerex > "$RUNNER_TEMP/program-headers.txt"
          readelf -dW zig-out/bin/teerex > "$RUNNER_TEMP/dynamic-section.txt"
          if grep -q INTERP "$RUNNER_TEMP/program-headers.txt" || \
             grep -q NEEDED "$RUNNER_TEMP/dynamic-section.txt"; then
            echo 'Linux CLI must not depend on a dynamic loader or shared libraries' >&2
            exit 1
          fi

      - name: Run offline comparison regressions without Rex
        if: runner.os == 'Linux'
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: python3 items/observe/test_observe.py CompareTest -v

      - name: Run offline maneuver regressions
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: python3 items/maneuvers/test_maneuvers.py -v

      - name: Run offline filter regressions
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: python3 items/filter/test_filter.py -v

      - name: Run opt-in historical observation cache regressions
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: python3 items/filter/test_cache.py -v

      - name: Run disposable-Linux doctor offline regressions
        if: runner.os == 'Linux'
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          TEEREX_OFFLINE_ONLY: '1'
        run: python3 items/doctor/test_doctor.py -v

      - name: Run cartridge lifecycle and native installed-payload contracts
        if: runner.os == 'Linux' || matrix.rex-api == 13
        run: |
          python3 -m unittest discover -s tools/cartridges -p test_cartridges.py -v
          python3 tools/cartridges/test_root_entry.py -v
          platform=x86_64-linux
          if [[ "$RUNNER_OS" == macOS ]]; then platform=aarch64-macos; fi
          python3 tools/cartridges/package.py --platform "$platform" \
            --version 0.1.0-alpha.5 --output "$RUNNER_TEMP/cartridge-catalog"
          TEEREX_BIN="$PWD/zig-out/bin/teerex" python3 tools/cartridges/test_payloads.py --catalog "$RUNNER_TEMP/cartridge-catalog"

      - name: Run installer lifecycle and public release controls
        if: runner.os == 'Linux' || matrix.rex-api == 13
        run: python3 tools/install/test_install.py --public -v

      - name: Cross-build Apple-silicon CLI
        if: runner.os == 'Linux'
        run: zig build -Doptimize=ReleaseSmall -Dtarget=aarch64-macos --prefix zig-out/mac

      - name: Verify runtime and install checksum-pinned Rex
        env:
          REX_API: ${{ matrix.rex-api }}
          REX_COMMIT: ${{ matrix.rex-commit }}
          REX_ARCHIVE: ${{ matrix.rex-archive }}
          REX_SHA256: ${{ matrix.rex-sha256 }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            sw_vers
            test "$(uname -m)" = arm64
            test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          else
            cat /etc/os-release
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
          fi
          archive="$RUNNER_TEMP/$REX_ARCHIVE"
          curl --fail --silent --show-error --location --retry 3 \
            "https://blob.superlogical.com/download/rex/preview/$REX_COMMIT/$REX_ARCHIVE" \
            -o "$archive"
          printf '%s  %s\n' "$REX_SHA256" "$archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/rex-bin"
          if [[ "$REX_ARCHIVE" == *.zip ]]; then
            unzip -q "$archive" -d "$RUNNER_TEMP/rex-bin"
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP/rex-bin"
          fi
          "$RUNNER_TEMP/rex-bin/rex" version | tee "$RUNNER_TEMP/rex-version.txt"
          grep -Fx "commit: $REX_COMMIT" "$RUNNER_TEMP/rex-version.txt"
          grep -E "^api: revision $REX_API \\(" "$RUNNER_TEMP/rex-version.txt"
          echo "$RUNNER_TEMP/rex-bin" >> "$GITHUB_PATH"

      - name: Run disposable-Rex observation, comparison and watch regressions
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: python3 items/observe/test_observe.py -v

      - name: Run disposable-Rex mailbox send regressions
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: |
          python3 items/send/test_send.py -v
          python3 items/clutch/test_clutch.py -v

      - name: Run disposable-Rex visible spawn regressions
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: python3 items/spawn/test_spawn.py -v

      - name: Run descriptor-bound read adapter regressions
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: python3 items/adapters/test_adapters.py -v

      - name: Run API13 responsibility registry and presentation regressions
        if: matrix.rex-api == 13
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: python3 items/jobs/test_jobs.py -v

      - name: Run explicit named-host and embedded fleet bridge contracts
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: |
          python3 src/test_targets.py -v
          python3 items/boards/test_boards.py CallsTest -v

      - name: Run visible surfaces and native palette plan/apply contracts
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: python3 items/surfaces/test_surfaces.py -v

      - name: Prepare disposable Linux SSH and fence acceptance
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap openssh-server slirp4netns
          sudo install -d -m 755 /run/sshd
          # Ubuntu restricts unprofiled user namespaces. Grant only the fixture's
          # bwrap executable; never disable the system-wide AppArmor restriction.
          cat > "$RUNNER_TEMP/teerex-ci-bwrap.apparmor" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile teerex-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --skip-kernel-load "$RUNNER_TEMP/teerex-ci-bwrap.apparmor"
          sudo apparmor_parser --add "$RUNNER_TEMP/teerex-ci-bwrap.apparmor"
          sysctl kernel.apparmor_restrict_unprivileged_userns
          bwrap --ro-bind / / /bin/true

      - name: Run API13 boards, managed agent and recovery integration
        if: matrix.rex-api == 13
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
          TEEREX_AGENTS_INTEGRATION: '1'
          TEEREX_AGENTS_CROSS_SESSION: '1'
          TEEREX_AGENTS_SSH: ${{ runner.os == 'Linux' && '1' || '0' }}
          TEEREX_AGENTS_FENCE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          zig build-exe --dep rex_boards -Mroot=items/boards/test_cli.zig \
            -Mrex_boards=items/boards/main.zig -O ReleaseSmall \
            -femit-bin="$RUNNER_TEMP/boards-route-helper"
          BOARDS_ROUTE_HELPER_BIN="$RUNNER_TEMP/boards-route-helper" python3 items/boards/test_boards.py -v
          # TEEREX_AGENTS_FENCE also gates the real fence-probe containment/egress/PTY cases.
          python3 items/agents/test_agents.py -v
          python3 items/recovery/test_recovery.py -v
          python3 tools/fleet-install/test_fleet_install.py -v

      - name: Run older API recovery update inventory/refusal
        if: matrix.rex-api != 13
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: python3 items/recovery/test_recovery.py -v

      - name: Run native installed-cartridge runtime contracts
        if: runner.os == 'Linux' || matrix.rex-api == 13
        env:
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: python3 tools/cartridges/test_payloads.py --catalog "$RUNNER_TEMP/cartridge-catalog" --with-rex

      - name: Check shared observation terms offline
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: python3 items/replay/test_terms.py OfflineTerms -v

      - name: Probe API13 replay data wire on a private server
        if: matrix.rex-api == 13
        env:
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: |
          python3 items/replay/test_wire.py -v
          python3 items/replay/test_replay.py FactContract Replay -v
          python3 items/replay/test_terms.py -v

      - name: Run API13 visible foreground execution and cleanup contracts
        if: matrix.rex-api == 13
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: python3 items/run/test_visible.py -v

      - name: Refuse visible execution before creation on older APIs
        if: matrix.rex-api != 13
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
          REX_BIN: ${{ runner.temp }}/rex-bin/rex
        run: python3 items/run/test_visible.py VisibleTest.test_observed_api_gate_precedes_creation -v

      - name: Run disposable-Mac execution and cleanup regressions
        if: runner.os == 'macOS'
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: python3 items/run/test_run.py -v

      - name: Run disposable doctor regressions
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: python3 items/doctor/test_doctor.py -v

      - name: Run disposable-Mac API13 offstage regressions
        if: runner.os == 'macOS' && matrix.rex-api == 13
        env:
          TEEREX_BIN: ${{ github.workspace }}/zig-out/bin/teerex
        run: python3 items/offstage/test_offstage.py -v
